[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "retail-sales-data-pipeline"
version = "0.1.0"
description = "Batch retail sales pipeline with Python, PySpark, Delta Lake, and SQL."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "pyspark>=3.5,<4.0",
  "delta-spark>=3.2,<4.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0,<9.0",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

